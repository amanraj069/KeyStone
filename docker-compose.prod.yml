# Production stack for the single EC2 instance. SKELETON: completed in Stage 14
# (Dockerfiles, worker entrypoint, Caddyfile, backups).
#
# Security rule (AGENTS.md section 3): falkordb and redis publish NO ports.
# They are reachable only on the internal Docker network, by api and worker.
# Only caddy is exposed to the internet (80/443) and proxies to api:4000.

name: keystone-prod

services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--requirepass ${FALKOR_PASSWORD:?Set FALKOR_PASSWORD}"
      FALKOR_PASSWORD: ${FALKOR_PASSWORD}
      BROWSER: "0" # no FalkorDB Browser UI in production
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$FALKOR_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    # no `ports:` on purpose

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    # no `ports:` on purpose

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile # TODO Stage 14
    restart: unless-stopped
    env_file: .env
    environment:
      INGEST_WORKER_INLINE: "false" # jobs run in the worker container
      FALKOR_HOST: falkordb
      FALKOR_PORT: "6379"
      REDIS_URL: redis://redis:6379
    depends_on:
      falkordb: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile # same image as api, different command
    command: ["node", "dist/worker.js"] # BullMQ ingest worker (apps/api/src/worker.ts)
    restart: unless-stopped
    env_file: .env
    environment:
      FALKOR_HOST: falkordb
      FALKOR_PORT: "6379"
      REDIS_URL: redis://redis:6379
    depends_on:
      falkordb: { condition: service_healthy }
      redis: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  falkordb_data:
  redis_data:
  caddy_data:
